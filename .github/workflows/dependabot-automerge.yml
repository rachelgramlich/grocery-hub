# Enable auto-merge on Dependabot PRs only (minor/patch groups in dependabot.yml).
# Requires repo setting "Allow auto-merge" and a required check on main (job name: test).

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

# enablePullRequestAutoMerge (gh pr merge --auto) needs contents: write, not read-only.
# Explicit scopes apply even on Dependabot pull_request workflows (see GitHub Dependabot-on-Actions docs).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Python group is minor+patch only; skip semver-major. All github-actions pin bumps auto-merge.
      - name: Enable auto-merge (squash)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
